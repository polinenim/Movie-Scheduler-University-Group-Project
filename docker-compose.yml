services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cineschedule-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      JDBC_URL: ${JDBC_URL:-jdbc:mysql://mysql:3306/cineschedule?useSSL=false&allowPublicKeyRetrieval=true}
      DB_USER: ${DB_USER:-cineschedule}
      DB_PASS: ${DB_PASS:-cineschedule}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_OMDB_API_KEY: ${VITE_OMDB_API_KEY:-d2991ad0}
    image: cineschedule-frontend
    depends_on:
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cineschedule}
      MYSQL_USER: ${DB_USER:-cineschedule}
      MYSQL_PASSWORD: ${DB_PASS:-cineschedule}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD:-rootpass}",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  backend-data:
  mysql-data:
