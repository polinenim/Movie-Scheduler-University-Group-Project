server.port=8080

# Database configuration (falls back to H2 file database if connection fails)
# MODE=MySQL enables MySQL compatibility for H2
jdbc.url=jdbc:h2:file:./data/demodb;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
db.user=sa
db.pass=

# JWT settings
jwt.secret=dev-secret-change-me
jwt.exp.minutes=60

